name: dbt CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Generate raw data
        run: python scripts/generate_data.py retail_dbt/ci.duckdb

      - name: Install dbt packages
        working-directory: retail_dbt
        run: dbt deps

      - name: Build and test
        working-directory: retail_dbt
        run: dbt build --profiles-dir ci
