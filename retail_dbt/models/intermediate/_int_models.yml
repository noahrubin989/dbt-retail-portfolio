version: 2

models:
  - name: int_order_lines_joined
    description: "Order lines joined to their order header (customer, store, payment method, timestamp). One row per order line. Lines whose order does not exist are dropped by the inner join."
    columns:
      - name: order_line_id
        description: "Unique identifier of the order line. This is the grain of the model."
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: "Identifier of the order this line belongs to."
        data_tests:
          - not_null
      - name: product_id
        description: "Identifier of the product on this line."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        description: "Number of units bought on this line. Always positive."
        data_tests:
          - not_null
      - name: unit_price
        description: "Price per unit at the time of sale, as a decimal with the currency symbol removed."
        data_tests:
          - not_null
      - name: customer_id
        description: "Identifier of the customer who placed the order. Null for walk-in sales, which are mapped to the Guest customer later."
      - name: store_id
        description: "Identifier of the store or web channel where the order was placed. Null on a small number of orders in the source, reported as a warning."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: payment_method_id
        description: "Identifier of the payment method used. Null on a small number of orders in the source, reported as a warning."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: order_timestamp
        description: "Timestamp when the sale happened, taken from the order."
        data_tests:
          - not_null
      - name: line_created_at
        description: "Timestamp when the order line record was created."
      - name: line_updated_at
        description: "Timestamp when the order line record was last updated."
        data_tests:
          - not_null

  - name: int_returns_signed
    description: "Returns joined to the original order line, with quantity made negative so they can be stacked with sales in fact_sales. One row per return. Returns with no matching order line are dropped by the inner join."
    columns:
      - name: return_id
        description: "Unique identifier of the return. This is the grain of the model."
        data_tests:
          - unique
          - not_null
      - name: order_line_id
        description: "Identifier of the original order line being returned."
        data_tests:
          - not_null
      - name: order_id
        description: "Identifier of the original order."
        data_tests:
          - not_null
      - name: product_id
        description: "Identifier of the returned product."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        description: "Units returned, as a negative number. The sign is flipped here from the positive value in the source."
        data_tests:
          - not_null
      - name: unit_price
        description: "Price per unit from the original sale. Stays positive."
        data_tests:
          - not_null
      - name: customer_id
        description: "Customer on the original order. Null for walk-in sales, which are mapped to the Guest customer later."
      - name: store_id
        description: "Store or web channel of the original order. Null on a small number of orders in the source, reported as a warning."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: payment_method_id
        description: "Payment method of the original order. Null on a small number of orders in the source, reported as a warning."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: return_timestamp
        description: "Timestamp when the return happened. This, not the original order timestamp, becomes the date of the return row."
        data_tests:
          - not_null
      - name: return_created_at
        description: "Timestamp when the return record was created."
      - name: return_updated_at
        description: "Timestamp when the return record was last updated."
        data_tests:
          - not_null