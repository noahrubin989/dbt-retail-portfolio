seeds:
  - name: au_public_holidays
    description: "..."
    config:
      column_types:
        holiday_date: date
        holiday_name: varchar
    columns:
      - name: holiday_date
        description: "The date of the holiday."
        data_tests:
          - not_null
          - unique
      - name: holiday_name
        description: "The name of the holiday."
        data_tests:
          - not_null